specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Adaptigent
providerId: adaptigent
created: '2026-05-04'
modified: '2026-08-30'
generated: '2026-08-30'
method: searched
source: https://www.adaptigent.com/resources/pricing/
# 2026-08-30: this file previously held a three-tier free/professional/enterprise
# scaffold written by the 2026-05-04 bulk sweep with invented quotas and prices.
# Adaptigent publishes no such tiers. The scaffold has been removed and replaced
# with what the pricing page actually says. See roadmap#35.
tags:
  - Mainframe
  - Integration
  - API Gateway
  - Legacy Systems
  - Enterprise
  - No Code
  - Middleware
description: >-
  Adaptigent publishes no named plans, no prices, and no quotas. The pricing page
  describes a model in prose and ends in a CONTACT SALES button. Recorded here as
  plan_count 0 with the model captured, rather than omitted — an honest zero is
  the measurement.
plan_count: 0
plans: []
pricing_model:
  type: consumption-based
  public_prices: false
  currency: null
  billing_period: quarterly (post-pay option)
  contact_sales: https://www.adaptigent.com/contact-sales/
  statements:
    - '"Consumption-based pricing"'
    - '"Flexible Pre-Pay or Post-Pay models" — pre-pay for transactions at discounted rates, or post-pay quarterly'
    - '"Volume-based discounts" as usage increases'
    - '"only pay for what you use, aligning your costs with revenue generated or cost savings"'
  metering:
    unit: transaction
    reporting: >-
      Transaction volume is tracked automatically and surfaced to the customer via
      a dashboard, per the pricing page. No public metering API or usage endpoint
      is documented.
  notes: >-
    Pricing is negotiated per deployment. The product is installable software
    (Windows, Linux, OpenShift Container) and is also listed on Red Hat
    Marketplace, where transactable terms are set by that marketplace listing
    rather than published here.
