# 2026-08-30: this file previously carried invented free/professional/enterprise
# tiers (10/100/1000 rpm) and an invented X-RateLimit-* header set written by the
# 2026-05-04 bulk sweep. None of it is published by Adaptigent. Removed. See roadmap#35.
tags:
  - Mainframe
  - Integration
  - API Gateway
  - Legacy Systems
  - Enterprise
  - No Code
  - Middleware
  - Rate Limiting
description: >-
  Adaptigent publishes no rate limits, and structurally would not: the Adaptive
  Integration Fabric runtime is deployed inside the customer's own environment, so
  throughput ceilings are set by the customer's z/OS region, CICS/IMS transaction
  capacity and Fabric configuration — not by an Adaptigent-operated gateway. No
  rate-limit response headers, no 429 semantics and no quota documentation were
  found on the public site. Recorded as limit_count 0.
limit_count: 0
limits: []
headers: {}
responseCodes: {}
policies: []
notes:
  - >-
    The commercial meter is transaction volume (see plans/adaptigent-plans-pricing.yml),
    which is a billing measure reported on a dashboard, not an enforced request
    ceiling with a runtime signal.
  - >-
    The one Adaptigent-operated runtime dependency named publicly is the optional
    Public Authoritative Count Server (ACS) added in Fabric v7.2.0/7.2.1, which
    counts transactions for licensing. No limits or throttling behaviour for it are
    documented, and customers may run a Private ACS instead.
  - >-
    Any limits that do apply to a specific customer deployment are set in that
    contract and in the customer-only support portal (gtsoftware2.zendesk.com),
    which answers 401 anonymously.
