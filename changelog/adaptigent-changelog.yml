  - version: '7.2.1'
    product: Adaptive Integration Fabric
    date: '2025-07-21'
    announced: '2026-03-27'
    url: https://www.adaptigent.com/blog/introducing-adaptive-integration-fabric-v7-2-1/
    breaking: []
    additions:
      - Public and Private Authoritative Count Server (ACS) configurations for Fabric users running Java environments
      - Public ACS hosted by Adaptigent for managed access; Private ACS for deployment inside customer environments
      - OpenAPI enhancements — improved operation ID field mapping
      - Extended query parameter support — decimal, short, long, date and dateTime data types
      - Optional Input Setting — REST inputs configurable as optional at runtime
      - UTF-8 conversion control via the new badCharConversionSubstitute server parameter
      - API Transformer authentication using API keys for APIMatic conversions
    highlights:
      - Corrected zero-element array representation in REST responses
      - Enhanced boolean value initialization in Studio test cases
      - Improved character encoding for REST test tool headers
      - Refined OpenAPI import across Studio wizards and CLI tools
    notes: >-
      Follow-up to v7.2.0, which introduced the foundational ACS infrastructure
      changes. The announcement states no breaking changes or deprecations.
  - version: '9.1.0'
    product: ASSIST/TS and BMS/TS
    date: '2025-12-02'
    url: https://www.adaptigent.com/blog/assist-ts-and-bms-ts-v9-1-0-now-available-with-full-cics-ts-6-3-support/
    breaking: []
    additions:
      - Full compatibility with IBM CICS/TS 6.3; updated support executables replacing modules that relied on WTO macros
      - ASSIST/TS — final GLUE warning captured in GWAREA and surfaced through the GTAS transaction in the GTASTAT IVP
      - ASSIST/TS — Preference Conversion and Runtime components folded into the standard installer
      - ASSIST/TS — optional GTA$AUSR module supporting UserHelp Simulation when *ADMIN UHLP=Y
      - BMS/TS — online memory display updated for CICS/TS 6.3 across z/OS and VSEn
      - BMS/TS — license expiration alerts surfaced via message B016 on the 3270 display and OS console
      - BMS/TS — administrator HTML pages and ELUA scripts accept usernames up to 8 chars and passwords up to 100 chars
      - BMS/TS — TCPIP Services gain attention messages and command-line refresh/status controls
  - version: '6.5'
    product: Ivory Suite (now Adaptive Integration Fabric)
