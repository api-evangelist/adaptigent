      - path: /.well-known/agent.json
        status: 404
notes:
  - >-
    /llms.txt on the same host DOES return a real 200 text/plain document —
    saved verbatim to llms/adaptigent-llms.txt and pointed at with type: LLMsTxt.
  - >-
    Contract discovery (STEP 0b) also missed on www.adaptigent.com/openapi.json
    (404), /swagger.json (404), /api-docs (404), /docs (404), /developers (404)
    and /developer (404). api.adaptigent.com, docs.adaptigent.com,
    developer.adaptigent.com and support.adaptigent.com do not resolve in DNS.
  - >-
    Alternate-contract probes also missed: /?wsdl and /?singleWsdl return the
    WordPress homepage (200 text/html — the query string is ignored, not a SOAP
    contract), /asyncapi.yaml 404, /graphql 404. Adaptigent's product GENERATES
    REST/SOAP contracts into customer environments; it publishes none of its own.
