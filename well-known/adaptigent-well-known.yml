method: probed
source: >-
  Live HTTP probes of the /.well-known/ discovery surface on every host named in
  apis.yml. Adaptigent publishes no baseURL and no OpenAPI servers[] block — the
  Adaptive Integration Fabric is customer-deployed software, so the only host
  Adaptigent itself operates is the marketing site www.adaptigent.com (and the
  apex adaptigent.com, which serves the same WordPress instance).
description: >-
  Every /.well-known/ path probed returned 404 from the WordPress 404 handler
  (text/html error page, not a document). No security.txt, no OIDC or OAuth
  discovery, no api-catalog, no ai-plugin manifest, and no A2A agent card at
  either the canonical /.well-known/agent-card.json or the legacy
  /.well-known/agent.json path. Recorded as a measured absence: no WellKnown,
  SecurityTxt or AgentCard pointer is emitted in apis.yml because nothing is
  served.
