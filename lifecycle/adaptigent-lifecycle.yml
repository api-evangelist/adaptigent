  status/trust subdomain probes (status.adaptigent.com, trust.adaptigent.com — no DNS).
description: >-
  Lifecycle posture for Adaptigent. The company sells installable middleware
  (Adaptive Integration Fabric, Fabric Data Hub, the Intelligent Caching Engine,
  NetCOBOL, ASSIST/TS, BMS/TS) rather than operating a hosted API, so the
  lifecycle signals that normally attach to a public API — a dated API version,
  a Sunset/Deprecation header policy, a public status page — do not exist here.
  What does exist is a product release cadence announced on the blog and news
  feed, and support/maintenance handled through a customer-only portal.
versioning:
  scheme: per-product semantic-style version (major.minor.patch)
  mechanism: >-
    Software release version, chosen by the customer at install time. There is no
    request-level API version header and no server-side version pinning, because
    the API endpoints the platform produces are generated by and hosted on the
    customer's own infrastructure.
  current:
    Adaptive Integration Fabric: 7.2.1
    ASSIST/TS: 9.1.0
    BMS/TS: 9.1.0
  changelog: changelog/adaptigent-changelog.yml
  docs: https://www.adaptigent.com/blog/
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  notes: >-
    No published deprecation or end-of-life policy was found on the public site.
    The v7.2.1 release announcement explicitly names no deprecations. Product
    end-of-support dates, where they exist, are communicated through the customer
    support portal and contracts, neither of which is publicly readable. No
    Deprecation pointer is emitted in apis.yml — there is no public policy to
    point at.
sla:
  url: null
  public_uptime_target: null
  notes: >-
    No public SLA or uptime commitment. Because the runtime is deployed inside the
    customer's environment (Windows, Linux, or OpenShift Container), availability
    is the customer's, not Adaptigent's. The one Adaptigent-operated runtime
    component named publicly is the optional Public Authoritative Count Server
    (ACS) introduced in Fabric v7.2.0/7.2.1; customers who prefer not to depend on
    it may run a Private ACS in their own environment.
